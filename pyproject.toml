# Modified by Perceptron AI, Inc.; derived from OpenAI Harmony.
[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "mharmony"
description = "Portable Harmony conversation rendering and parsing"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "MODIFICATIONS.md", "THIRD_PARTY_LICENSES.md"]
authors = [{ name = "Perceptron AI, Inc." }]
keywords = ["ai", "chat", "harmony", "tokenizer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Typing :: Typed",
]
dynamic = ["version"]
dependencies = ["pydantic>=2.11.7,<3.0.0"]

[project.optional-dependencies]
qwen35 = [
    "numpy>=2.0.0,<2.3.0",
    "Pillow>=10.0.0,<13.0.0",
    "torch>=2.7.0,<2.12.0",
    "torchvision>=0.22.0,<0.27.0",
    "transformers==5.5.4",
]
test = [
    "pytest>=8.4.1,<9.0.0",
    "tomli>=2.2.1,<3.0.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/perceptron-ai-inc/mharmony"
Documentation = "https://github.com/perceptron-ai-inc/mharmony/tree/main/docs"
Repository = "https://github.com/perceptron-ai-inc/mharmony"
Issues = "https://github.com/perceptron-ai-inc/mharmony/issues"

[tool.maturin]
features = ["python-binding", "pyo3/extension-module"]
include = [
    { path = "SOURCE_MANIFEST.json", format = "sdist" },
    { path = "MODIFICATIONS.md", format = "sdist" },
    { path = "THIRD_PARTY_LICENSES.md", format = "sdist" },
    { path = "mharmony/SOURCE_MANIFEST.json", format = "wheel" },
    { path = "mharmony/MODIFICATIONS.md", format = "wheel" },
    { path = "mharmony/THIRD_PARTY_LICENSES.md", format = "wheel" },
]
module-name = "mharmony.mharmony"
python-source = "python"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.rs" },
    { file = "python/**/*.py" },
]

[tool.pytest.ini_options]
# Only collect tests from the top-level tests directory
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["numpy.*", "PIL.*", "torch.*", "torchvision.*", "transformers.*"]
ignore_missing_imports = true
